name: CI

# 工業可用化第一步的工程紀律基礎建設：每個 PR 自動跑 backend 單元測試 + Flutter 靜態分析/測試。
# 由 weekly routine agent 於 2026-05-16 首次建立。後續可逐步收緊（加 flutter analyze fatal、加更多 backend 測試檔）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 允許同一 PR 後續 push 取消前次跑到一半的 workflow，節省 minutes。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      # 跑「全部」後端測試（Issue #45 收緊：sprint 系列的 results.check
      # 已在 pytest 模式下改為真 assert，CI 可真正擋退化）。
      # GEMINI_API_KEY 用假值（這些測試不會打真實 API）。
      - name: Run pytest (full suite)
        env:
          GEMINI_API_KEY: ci-fake-key
        run: |
          pytest tests/ -v --tb=short --asyncio-mode=auto

  flutter-checks:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      # pubspec.yaml 將 .env 宣告為 asset，但 .env 被 gitignore（合理：含 GEMINI_API_KEY）。
      # CI 環境沒有此檔會導致 "Failed to build asset bundle"。建立空 .env 作為 placeholder
      # 讓 asset bundle 建立成功；測試本身不依賴真實 API key。
      - name: Create empty .env placeholder for asset bundle
        run: touch .env

      # 死角查核（讀寫兩端）：service 方法零引用、DB 欄位只讀不寫／只寫不讀。
      # 四輪人工查核抓到五個已出貨缺口，形狀都是「讀端接好、寫端沒接、讀端沒測試所以看不出來」
      # ——把問法變成守門。保守：寧可漏報不可誤攔；新發現要嘛修掉、要嘛在
      # scripts/audit_allowlist.json 附理由放行；名單裡已經修好的條目也會紅（名單不准長霉）。
      # 純 stdlib Python，不依賴 Flutter，所以排在 analyze 前面先失敗先講。
      - name: Dead-end audit (callers / columns)
        run: python3 scripts/audit_dead_ends.py

      # analyze 已轉硬性（warning 級以上擋 PR；info 級不擋）。
      # warning 已於 2026-08-31 全數清零，新增 warning 會在此失敗。
      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      # 跑「全部」Flutter 測試（widget_test 已修復，不再排除）
      - name: Unit tests
        run: flutter test

  blade-prototype:
    name: Blade prototype (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blade_prototype
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: blade_prototype/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 風力機葉片地面目視檢測原型（BLADE_INSPECTION_SPEC.md §5.1–5.4 的 Python 參考實作）。
      # 全部用合成影像做為夾具，不需外部資料。
      - name: Run pytest
        run: pytest --tb=short
